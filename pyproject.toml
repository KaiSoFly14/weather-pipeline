[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-pipeline"
version = "0.1.0"
description = "A data pipeline for extracting, transforming, validating, and loading weather data."
requires-python = ">=3.11"

dependencies = [
"pandas",
"requests",
]

[project.optional-dependencies]
dev = [
"pytest",
"ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"